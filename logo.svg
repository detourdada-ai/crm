<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <!-- Symbol: Sheet & Point (시안 1 적용) -->
  <g transform="translate(10, 15)">
    <rect x="0" y="0" width="60" height="70" rx="14" fill="#0F172A" />
    <path d="M 15 17 L 45 17" stroke="#334155" stroke-width="5" stroke-linecap="round" />
    <path d="M 15 31 L 32 31" stroke="#334155" stroke-width="5" stroke-linecap="round" />
    <circle cx="20" cy="49" r="5" fill="#10B981" />
    <circle cx="38" cy="49" r="5" fill="#FFFFFF" />
  </g>

  <!-- Wordmark: 주문:한장 -->
  <g transform="translate(90, 20)">
    <text x="0" y="48" font-family="'Pretendard', system-ui, sans-serif" font-size="46" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">주문</text>
    
    <!-- Colon Point -->
    <circle cx="106" cy="28" r="5" fill="#10B981" />
    <circle cx="106" cy="46" r="5" fill="#0F172A" />
    
    <text x="122" y="48" font-family="'Pretendard', system-ui, sans-serif" font-size="46" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">한장</text>
  </g>
</svg>
